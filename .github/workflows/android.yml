name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Auto-Patch Source Code & Fix Compatibility
      run: |
        echo "Running automatic code fixes before compilation..."
        python3 -c "
        import os, glob, shutil

        # 1. Fix BottomPlayerBar.kt type mismatch (progress = { progress } -> progress = progress)
        for f in glob.glob('**/BottomPlayerBar.kt', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    content = fp.read()
                if 'progress = { progress }' in content:
                    content = content.replace('progress = { progress }', 'progress = progress')
                    with open(f, 'w', encoding='utf-8') as fp:
                        fp.write(content)
                    print('Patched BottomPlayerBar.kt successfully:', f)
            except Exception as e:
                print('Error patching', f, e)

        # 2. Fix missing setContent import in YouTubePlayerActivity.kt
        for f in glob.glob('**/YouTubePlayerActivity.kt', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    content = fp.read()
                if 'setContent' in content and 'import androidx.activity.compose.setContent' not in content:
                    content = content.replace(
                        'import androidx.activity.ComponentActivity',
                        'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent'
                    )
                    with open(f, 'w', encoding='utf-8') as fp:
                        fp.write(content)
                    print('Patched YouTubePlayerActivity.kt successfully:', f)
            except Exception as e:
                print('Error patching', f, e)

        # 3. Ensure root build.gradle.kts declares org.jetbrains.kotlin.kapt
        for f in glob.glob('**/build.gradle.kts', recursive=True):
            if '/app/' not in f:
                try:
                    with open(f, 'r', encoding='utf-8') as fp:
                        content = fp.read()
                    if 'org.jetbrains.kotlin.kapt' not in content and 'plugins {' in content:
                        content = content.replace(
                            'plugins {',
                            'plugins {\n    id(\"org.jetbrains.kotlin.kapt\") version \"1.9.22\" apply false'
                        )
                        with open(f, 'w', encoding='utf-8') as fp:
                            fp.write(content)
                        print('Added kapt to root build.gradle.kts:', f)
                except Exception as e:
                    print('Error patching', f, e)

        # 4. Fix app build.gradle.kts plugins and lint
        for f in glob.glob('**/build.gradle.kts', recursive=True):
            if '/app/' in f:
                try:
                    with open(f, 'r', encoding='utf-8') as fp:
                        content = fp.read()
                    modified = False
                    if 'id(\"kotlin-kapt\")' in content:
                        content = content.replace('id(\"kotlin-kapt\")', 'kotlin(\"kapt\")')
                        modified = True
                    if 'android {' in content and 'abortOnError' not in content:
                        content = content.replace(
                            'android {',
                            'android {\n    lint {\n        abortOnError = false\n        checkReleaseBuilds = false\n    }'
                        )
                        modified = True
                    if modified:
                        with open(f, 'w', encoding='utf-8') as fp:
                            fp.write(content)
                        print('Patched app build.gradle.kts successfully:', f)
                except Exception as e:
                    print('Error patching', f, e)

        # 5. Fix AndroidManifest.xml icons and ensure both drawables exist
        for f in glob.glob('**/AndroidManifest.xml', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    content = fp.read()
                content = content.replace('drawable/ic_launcher_foreground_round', 'drawable/ic_launcher_foreground')
                content = content.replace('@mipmap/ic_launcher_round', '@drawable/ic_launcher_foreground')
                content = content.replace('@mipmap/ic_launcher', '@drawable/ic_launcher_foreground')
                with open(f, 'w', encoding='utf-8') as fp:
                    fp.write(content)
                print('Patched AndroidManifest.xml successfully:', f)
            except Exception as e:
                print('Error patching', f, e)

        for d in glob.glob('**/res/drawable*', recursive=True):
            fg = os.path.join(d, 'ic_launcher_foreground.xml')
            fg_round = os.path.join(d, 'ic_launcher_foreground_round.xml')
            if os.path.exists(fg):
                shutil.copyfile(fg, fg_round)
                print('Created ic_launcher_foreground_round.xml in:', d)

        # 6. Fix PlayerViewModel.kt generic type inference in Gson.fromJson
        for f in glob.glob('**/PlayerViewModel.kt', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    content = fp.read()
                if 'Gson().fromJson(playlist.videosJson, type)' in content:
                    content = content.replace(
                        'Gson().fromJson(playlist.videosJson, type)',
                        'Gson().fromJson<MutableList<VideoItem>>(playlist.videosJson, type)'
                    )
                    with open(f, 'w', encoding='utf-8') as fp:
                        fp.write(content)
                    print('Patched PlayerViewModel.kt successfully:', f)
            except Exception as e:
                print('Error patching PlayerViewModel', f, e)

        # 7. Fix YouTube Background and Error 153 in YouTubePlayerActivity.kt
        for f in glob.glob('**/YouTubePlayerActivity.kt', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    content = fp.read()
                if 'userAgentString' not in content:
                    content = content.replace(
                        'settings.mediaPlaybackRequiresUserGesture = false',
                        'settings.mediaPlaybackRequiresUserGesture = false\n                                    settings.userAgentString = \"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36\"'
                    )
                old_load = 'loadUrl(\"https://www.youtube.com/embed/\$videoId?autoplay=1&playsinline=1&rel=0\")'
                if old_load in content:
                    new_embed = '''val embedHtml = \"\"\"
                                        <!DOCTYPE html>
                                        <html>
                                        <head>
                                            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">
                                            <meta name=\"referrer\" content=\"strict-origin-when-cross-origin\">
                                            <style>html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; } iframe { width: 100%; height: 100%; border: 0; }</style>
                                        </head>
                                        <body>
                                            <iframe src=\"https://www.youtube-nocookie.com/embed/\$videoId?autoplay=1&playsinline=1&enablejsapi=1&rel=0&origin=https://www.youtube-nocookie.com\" referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen></iframe>
                                        </body>
                                        </html>
                                    \"\"\".trimIndent()
                                    loadDataWithBaseURL(\"https://www.youtube-nocookie.com\", embedHtml, \"text/html\", \"utf-8\", null)'''
                    content = content.replace(old_load, new_embed)
                with open(f, 'w', encoding='utf-8') as fp:
                    fp.write(content)
                print('Patched YouTubePlayerActivity.kt:', f)
            except Exception as e:
                print('Error patching YouTubePlayerActivity', f, e)

        # 8. Ensure supportsPictureInPicture in AndroidManifest.xml
        for f in glob.glob('**/AndroidManifest.xml', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    c = fp.read()
                if 'YouTubePlayerActivity' in c and 'supportsPictureInPicture' not in c:
                    c = c.replace(
                        'android:name=\".YouTubePlayerActivity\"',
                        'android:name=\".YouTubePlayerActivity\"\n            android:supportsPictureInPicture=\"true\"\n            android:resizeableActivity=\"true\"\n            android:configChanges=\"orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden\"'
                    )
                    with open(f, 'w', encoding='utf-8') as fp:
                        fp.write(c)
                    print('Added PiP support to AndroidManifest.xml:', f)
            except Exception as e:
                print('Error adding PiP to manifest', f, e)

        # 9. Fix MainScreen.kt syntax issues and bottomBar Column missing brace
        for f in glob.glob('**/MainScreen.kt', recursive=True):
            try:
                with open(f, 'r', encoding='utf-8') as fp:
                    c = fp.read()
                broken_block = '''                    }
                }
        },
        containerColor = MaterialTheme.colorScheme.background'''
                fixed_block = '''                    }
                }
            }
        },
        containerColor = MaterialTheme.colorScheme.background'''
                if broken_block in c:
                    c = c.replace(broken_block, fixed_block)
                    print('Fixed missing brace in MainScreen.kt bottomBar Column:', f)
                if 'fun MainScreen(viewModel: PlayerViewModel' in c and 'fun MainScreen(viewModel: PlayerViewModel)' not in c:
                    c = c.replace('fun MainScreen(viewModel: PlayerViewModel', 'fun MainScreen(viewModel: PlayerViewModel)')
                with open(f, 'w', encoding='utf-8') as fp:
                    fp.write(c)
                print('Patched MainScreen.kt:', f)
            except Exception as e:
                print('Error patching MainScreen.kt', f, e)
        "
        echo "Auto-patch completed."

    - name: Build Android APK
      run: |
        set -e
        set -o pipefail
        if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
          echo "Detected Android project in 'android/' subdirectory"
          cd android
        else
          echo "Detected Android project at repository root"
        fi

        echo "Accepting Android SDK licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

        echo "Building Android APK..."
        if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          chmod +x gradlew
          echo "Executing ./gradlew assembleDebug..."
          ./gradlew assembleDebug --no-daemon
        else
          echo "Using Gradle CLI directly..."
          gradle assembleDebug --no-daemon
        fi

    - name: List Generated APK Files
      run: |
        echo "Locating built APK files:"
        find . -name "*.apk" -ls

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeMusic-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
        if-no-files-found: error
        retention-days: 14
